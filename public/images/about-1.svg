<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2440"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="acGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- AC Indoor Unit -->
  <rect x="180" y="160" width="440" height="150" rx="16" fill="#f8fafc" stroke="#93c5fd" stroke-width="4"/>
  <rect x="210" y="270" width="380" height="20" rx="6" fill="#0f2440"/>
  <line x1="220" y1="280" x2="580" y2="280" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="580" cy="200" r="6" fill="#10b981"/>
  <text x="540" y="204" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="bold">24°C</text>
  <text x="210" y="210" font-family="sans-serif" font-size="16" fill="#1e3a5f" font-weight="bold">AFA JAYA TEHNIK</text>
  
  <!-- Cold air flow waves -->
  <path d="M 230 310 Q 250 420 300 480" fill="none" stroke="url(#acGlow)" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M 330 310 Q 360 410 400 480" fill="none" stroke="url(#acGlow)" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M 430 310 Q 450 410 500 480" fill="none" stroke="url(#acGlow)" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M 530 310 Q 550 420 600 480" fill="none" stroke="url(#acGlow)" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Badge banner -->
  <rect x="230" y="500" width="340" height="50" rx="25" fill="#ffffff" fill-opacity="0.95"/>
  <text x="400" y="532" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#0f2440" font-weight="bold">Pemasangan AC Profesional</text>
</svg>
