<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- Vacuum Pump Machine Illustration -->
  <!-- Base pump -->
  <rect x="260" y="220" width="280" height="180" rx="14" fill="#334155" stroke="#60a5fa" stroke-width="3"/>
  <rect x="290" y="200" width="120" height="25" rx="5" fill="#1e293b"/>
  <!-- Handle -->
  <path d="M 330 200 L 330 160 L 470 160 L 470 200" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <!-- Pressure Gauges (Manifold) -->
  <circle cx="340" cy="300" r="45" fill="#f8fafc" stroke="#3b82f6" stroke-width="4"/>
  <circle cx="460" cy="300" r="45" fill="#f8fafc" stroke="#ef4444" stroke-width="4"/>
  <!-- Needles -->
  <line x1="340" y1="300" x2="355" y2="280" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="460" y1="300" x2="445" y2="275" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <text x="340" y="325" font-family="sans-serif" font-size="10" fill="#3b82f6" font-weight="bold" text-anchor="middle">LOW PSI</text>
  <text x="460" y="325" font-family="sans-serif" font-size="10" fill="#ef4444" font-weight="bold" text-anchor="middle">HIGH PSI</text>

  <!-- Vacuum hoses -->
  <path d="M 340 345 C 320 420, 200 420, 160 450" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <path d="M 460 345 C 480 420, 600 420, 640 450" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <path d="M 400 380 C 400 440, 400 440, 400 470" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round"/>

  <!-- Badge -->
  <rect x="220" y="500" width="360" height="50" rx="25" fill="#ffffff" fill-opacity="0.95"/>
  <text x="400" y="532" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1e1b4b" font-weight="bold">Mesin Vakum Standard Pabrik</text>
</svg>
